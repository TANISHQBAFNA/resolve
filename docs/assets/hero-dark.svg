<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">How Resolve fits in</title><desc id="d">Illustration. A designer's prompt, Build an Acme payments screen, goes to the AI tool. The AI asks Resolve, which finds the exact components. The result is an Acme screen built from real library parts: Payee picker, Text field and a primary Button.</desc><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><text x="64" y="112" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="48" font-weight="600" fill="#E6EDF3" text-anchor="start">Your AI, using your real components</text><rect x="64" y="208" width="264" height="208" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(88 232) scale(1.3333333333333333)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></g><text x="88" y="304" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#9198A1" text-anchor="start" letter-spacing="0.04em">PROMPT</text><text x="88" y="348" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">Build an Acme</text><text x="88" y="382" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">payments screen</text><g fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M336 312.0 H368"/><path d="M359 303.0 L368 312.0 L359 321.0"/></g><rect x="376" y="248.0" width="128" height="128" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(420 268.0) scale(1.6666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" str