<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="t d"><title id="t">Check result</title><desc id="d">Illustration of a real check on the Acme Send money screen. The screen holds a Payee picker, a Button and the retired Old Button, marked with pin 1. The verdict says FAIL, exit 1. 2 parts approved. 1 deprecated: Old Button, 30:50, swap it for Button.</desc><rect x="0.5" y="0.5" width="559" height="899" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><g><rect x="40" y="32" width="440" height="340" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="224.0" y="46" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="64" y="102" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g><rect x="64" y="132" width="392" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="100" cy="164" r="18" fill="#E6FAF7" stroke="#D0D7DE"/><text x="100" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">M</text><text x="130" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Maya Chen</text><path d="M426 156 l8 8 l-8 8" stroke="#59636E" stroke-width="2" fill="none"/></g><g><rect x="64" y="220" width="392" height="56" rx="10" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><text x="260.0" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Send</text></g><g><rect x="64" y="292" width="392" height="56" rx="10" fill="#F6F8FA" stroke="#CF222E" stroke-width="1.5" stroke-dasharray="6 5"/><text x="260.0" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight