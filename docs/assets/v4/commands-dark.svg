<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img"><title>Commands</title><desc>A command palette listing /design-system, /find, /check, /parts, /handoff, /brief and /spec, each with what it does.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#30363D"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><rect x="100" y="10" width="1000" height="564" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#s)"/><text x="132" y="68" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="28" font-weight="800" fill="#2DD4BF" text-anchor="start">/</text><text x="160" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#C9D1D9" text-anchor="start">Type a command</text><path d="M100 96 H1100" stroke="#30363D" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="106" width="980" height="56" rx="4" fill="#0E2F2C" stroke="none" stroke-width="1"/><rect x="110" y="106" width="4" height="56" rx="1" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="140" y="143" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/design-system</text><text x="1064" y="143" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">Learn your library</text><text x="140" y="207" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/find</text><text x="1064" y="207" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">Find the right part</text><text x="140" y="271" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/check</text><text x="1064" y="271" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">Check a screen</text><text x="140" y="335" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/parts</text><text x="1064" y="335" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">List the parts on a screen</text><text x="140" y="399" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/handoff</text><text x="1064" y="399" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">One sheet for developers</text><text x="140" y="463" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/brief</text><text x="1064" y="463" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">Up to 3 questions first</text><text x="140" y="527" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#E6EDF3" text-anchor="start">/spec</text><text x="1064" y="527" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="end">Map a Figma spec to parts</text></svg>