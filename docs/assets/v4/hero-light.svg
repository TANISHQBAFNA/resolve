<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"><title>Resolve: the right part, every screen</title><desc>Resolve sits between the Acme library and your AI. Lines run from the Button, Text field and Payee picker components, through Resolve, to the Send money phone screen built from them.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2328" flood-opacity=".10"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1F2328" flood-opacity=".10"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#D0D7DE"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><rect x="0" y="0" width="72" height="6" rx="1" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="0" y="52" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#424A53" text-anchor="start" letter-spacing="3">RESOLVE · FOR CLAUDE CODE AND CURSOR</text><text x="0" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" fill="#1F2328" text-anchor="start">The right part.</text><text x="0" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" fill="#1F2328" text-anchor="start">Every screen.</text><text x="0" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#424A53" text-anchor="start">Your AI asks Resolve which of your Figma components to use,</text><text x="0" y="358" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#424A53" text-anchor="start">builds the screen with them, then checks it.</text><rect x="0" y="400" width="1200" height="400" fill="url(#g)"/><text x="0" y="444" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#424A53" text-anchor="start" letter-spacing="3">ACME LIBRARY</text><rect x="0" y="470" width="330" height="84" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><rect x="18" y="492" width="64" height="40" rx="4" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="102" y="520.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Button</text><rect x="0" y="570" width="330" height="84" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><rect x="18" y="592" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#424A53" stroke-width="1.4"/><path d="M30 604 v16" stroke="#424A53" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="620.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Text field</text><rect x="0" y="670" width="330" height="84" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><circle cx="38" cy="712" r="16" fill="#E6FAF7" stroke="#2DD4BF" stroke-width="1.5"/><rect x="60" y="704" width="24" height="6" rx="2" fill="#D0D7DE" stroke="none" stroke-width="1"/><rect x="60" y="716" width="16" height="6" rx="2" fill="#D0D7DE" stroke="none" stroke-width="1"/><text x="102" y="720.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Payee picker</text><rect x="520" y="590" width="190" height="64" rx="6" fill="#2DD4BF" stroke="none" stroke-width="1" filter="url(#s)"/><text x="615" y="631" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-seri