<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img"><title>What Resolve does</title><desc>Three steps. 01 Learn with /design-system: stacked library layers. 02 Match with /find: the words payee picker lead to the Payee picker component. 03 Check with /check: a screen with a pinned problem and a tick.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2328" flood-opacity=".10"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1F2328" flood-opacity=".10"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#D0D7DE"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><path d="M30 190 l140.0 -70.0 l140.0 70.0 l-140.0 70.0 z" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.4"/><path d="M30 154 l140.0 -70.0 l140.0 70.0 l-140.0 70.0 z" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.4"/><path d="M30 118 l140.0 -70.0 l140.0 70.0 l-140.0 70.0 z" fill="#E6FAF7" stroke="#2DD4BF" stroke-width="1.4"/><path d="M120 118 l50.0 -25.0 l50.0 25.0 l-50.0 25.0 z" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.4"/><rect x="410" y="80" width="300" height="52" rx="4" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><text x="428" y="114" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">“payee picker”</text><path d="M560 132 V168" stroke="#0D1117" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="132" r="4" fill="#FFFFFF" stroke="#0D1117" stroke-width="2"/><path d="M552 160 l8 9 l8 -9" stroke="#0D1117" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="176" width="340" height="84" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><circle cx="448" cy="218" r="16" fill="#E6FAF7" stroke="#2DD4BF" stroke-width="1.5"/><rect x="470" y="210" width="24" height="6" rx="2" fill="#D0D7DE" stroke="none" stroke-width="1"/><rect x="470" y="222" width="16" height="6" rx="2" fill="#D0D7DE" stroke="none" stroke-width="1"/><text x="512" y="226.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Payee picker</text><rect x="820" y="70" width="240" height="190" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4" filter="url(#s)"/><rect x="840" y="100" width="200" height="40" rx="4" fill="#F6F8FA" stroke="none" stroke-width="1"/><rect x="840" y="196" width="200" height="44" rx="4" fill="#CF222E" stroke="none" stroke-width="1"/><text x="940.0" y="226.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pay now</text><circle cx="1046" cy="196" r="15" fill="#CF222E"/><text x="1046" y="204" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="1120" cy="120" r="22" fill="#2DD4BF"/><path d="M1110.76 120 l6.6 7.48 l13.64 -14.96" stroke="#0D1117" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="330" width="56" height="6" rx="1" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="0" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">01</text><text x="70" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">Learn</text><text x="0" y="434" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="600" fill="#424A53" text-anchor="start">/design-system</text><rect x="410" y="330" width="56" height="6" rx="1" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="410" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">02</text><text x="480" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">Match</text><text x="410" y="434" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="600" fill="#424A53" text-anchor="start">/find</text><rect x="820" y="330" width="56" height="6" rx="1" fill="#2DD4BF" stroke="none" stroke-width="1"/><text x="820" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">03</text><text x="890" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1F2328" text-anchor="start">Check</text><text x="820" y="434" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24" font-weight="600" fill="#424A53" text-anchor="start">/check</text><text x="0" y="478" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">Reads every component,</text><text x="0" y="508" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">variant and property.</text><text x="410" y="478" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">Picks the right part</text><text x="410" y="508" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">from your words.</text><text x="820" y="478" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">Flags retired, detached</text><text x="820" y="508" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">and hard-coded parts.</text></svg>