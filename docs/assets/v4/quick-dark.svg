<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img"><title>Quick start in four steps</title><desc>1 Learn your library with /design-system. 2 Find a part with /find. 3 Ask your AI to design the screen. 4 Check it with /check.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#30363D"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><path d="M30 60 H1110" stroke="#30363D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="30" width="60" height="60" rx="6" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.5" filter="url(#s)"/><text x="30" y="70" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">1</text><path d="M250 52 l8 8 l-8 8" stroke="#C9D1D9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#E6EDF3" text-anchor="start">Learn</text><text x="0" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#C9D1D9" text-anchor="start">/design-system</text><rect x="300" y="30" width="60" height="60" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#s)"/><text x="330" y="70" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#E6EDF3" text-anchor="middle">2</text><path d="M550 52 l8 8 l-8 8" stroke="#C9D1D9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#E6EDF3" text-anchor="start">Find</text><text x="300" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#C9D1D9" text-anchor="start">/find</text><rect x="600" y="30" width="60" height="60" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#s)"/><text x="630" y="70" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#E6EDF3" text-anchor="middle">3</text><path d="M850 52 l8 8 l-8 8" stroke="#C9D1D9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#E6EDF3" text-anchor="start">Ask</text><text x="600" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#C9D1D9" text-anchor="start">“Design the screen”</text><rect x="900" y="30" width="60" height="60" rx="6" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.5" filter="url(#s)"/><text x="930" y="70" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#0D1117" text-anchor="middle">4</text><text x="900" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#E6EDF3" text-anchor="start">Check</text><text x="900" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#C9D1D9" text-anchor="start">/check</text></svg>