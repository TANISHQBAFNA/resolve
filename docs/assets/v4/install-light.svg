<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img"><title>Install</title><desc>Claude Code and Cursor each install the Resolve plugin. Resolve then connects to your Figma library with a token and a file key, such as ACMEUI. Needs Node 22.12 or newer and a Figma Dev or Full seat.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2328" flood-opacity=".10"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1F2328" flood-opacity=".10"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#D0D7DE"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><rect x="0" y="20" width="470" height="100" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><text x="24" y="62" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#1F2328" text-anchor="start">Claude Code</text><text x="24" y="98" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">/plugin install resolve@resolve</text><path d="M470 70 C515.0 70 515.0 150 560 150" stroke="#0D1117" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="70" r="5" fill="#FFFFFF" stroke="#0D1117" stroke-width="2"/><rect x="0" y="150" width="470" height="100" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><text x="24" y="192" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#1F2328" text-anchor="start">Cursor</text><text x="24" y="228" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">/add-plugin …/resolve</text><path d="M470 200 C515.0 200 515.0 150 560 150" stroke="#0D1117" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="200" r="5" fill="#FFFFFF" stroke="#0D1117" stroke-width="2"/><rect x="560" y="118" width="180" height="64" rx="6" fill="#2DD4BF" stroke="none" stroke-width="1" filter="url(#s)"/><text x="650" y="159" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#0D1117" text-anchor="middle">Resolve</text><path d="M740 150 H820" stroke="#0D1117" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="820" y="90" width="380" height="120" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/><text x="844" y="134" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Figma token + file key</text><text x="844" y="172" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#424A53" text-anchor="start">ACMEUI</text><text x="0" y="302" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#424A53" text-anchor="start">Needs Node 22.12 or newer and a Figma Dev or Full seat.</text></svg>