<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" width="1200" height="696" role="img">
<title>Commands</title>
<desc>Commands for this checkout: /design-system, /find, /configure, /brief, /check, /parts, /code-map, /spec, and opt-in /map.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2328" flood-opacity=".12"/></filter></defs>
<rect x="100" y="10" width="1000" height="656" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" filter="url(#s)"/>
<text x="132" y="68" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="28" font-weight="800" fill="#2DD4BF">/</text>
<text x="160" y="68" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#424A53">Type a command</text>
<path d="M100 96 H1100" stroke="#D0D7DE" stroke-width="1"/>
<text x="140" y="143" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/design-system</text>
<text x="1064" y="143" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Learn your library</text>
<text x="140" y="207" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/find</text>
<text x="1064" y="207" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Find a part from words</text>
<rect x="110" y="234" width="980" height="56" rx="4" fill="#E6FAF7"/>
<rect x="110" y="234" width="4" height="56" fill="#2DD4BF"/>
<text x="140" y="271" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/configure</text>
<text x="1064" y="271" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Choose a part and set its properties</text>
<text x="140" y="335" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/brief</text>
<text x="1064" y="335" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Up to 3 questions, including which part</text>
<text x="140" y="399" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/check</text>
<text x="1064" y="399" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Check a screen</text>
<text x="140" y="463" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/parts</text>
<text x="1064" y="463" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Parts on a screen and their code</text>
<text x="140" y="527" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/code-map</text>
<text x="1064" y="527" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Link a Figma part to code</text>
<text x="140" y="591" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/spec</text>
<text x="1064" y="591" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Map a written spec to parts</text>
<text x="140" y="655" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1F2328">/map</text>
<text x="1064" y="655" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#424A53" text-anchor="end">Opt-in screen tree</text>
</svg>
