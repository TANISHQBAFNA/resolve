<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><title>Check a screen</title><desc>A check of the Acme Send money screen fails with two problems: the button is detached, so use the library Button; the colour #1A73E8 is hard-coded, so use the token color/primary. Dashed red leader lines run to pins on the Pay now button. A teal line marks the Payee picker as coming from the library.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity=".55"/></filter><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#30363D"/></pattern><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="2000" fill="url(#fade)"/></mask></defs><text x="0" y="96" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="104" font-weight="800" fill="#F85149" text-anchor="start">FAIL.</text><text x="0" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#E6EDF3" text-anchor="start">Two problems, each with its fix.</text><rect x="860" y="20" width="320" height="520" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="url(#s)"/><rect x="992.0" y="32" width="56" height="5" rx="2.5" fill="#30363D" stroke="none" stroke-width="1"/><text x="882" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Send money</text><rect x="882" y="116" width="276" height="64" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><circle cx="916" cy="148" r="17" fill="#0E2F2C" stroke="#2DD4BF" stroke-width="1.5"/><text x="944" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">Maya Chen</text><rect x="882" y="204" width="276" height="56" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="898" y="240.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#C9D1D9" text-anchor="start">Amount</text><rect x="882" y="440" width="276" height="60" rx="4" fill="#1A73E8" stroke="#F85149" stroke-width="2" stroke-dasharray="6 4"/><text x="1020.0" y="478" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pay now</text><circle cx="16" cy="222" r="15" fill="#F85149"/><text x="16" y="230" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="48" y="230" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#E6EDF3" text-anchor="start">The button is detached.</text><text x="48" y="270" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#C9D1D9" text-anchor="start">Use the library Button.</text><path d="M520 222 H844 L904 440" stroke="#F85149" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="520" cy="222" r="3" fill="#F85149"/><circle cx="904" cy="440" r="15" fill="#F85149"/><text x="904" y="448" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="16" cy="342" r="15" fill="#F85149"/><text x="16" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="48" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#E6EDF3" text-anchor="start">#1A73E8 is hard-coded.</text><text x="48" y="390" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#C9D1D9" text-anchor="start">Use the token color/primary.</text><path d="M520 342 H1076 L1136 440" stroke="#F85149" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="520" cy="342" r="3" fill="#F85149"/><circle cx="1136" cy="440" r="15" fill="#F85149"/><text x="1136" y="448" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M0 420 H760" stroke="#30363D" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="470" r="13" fill="#2DD4BF"/><path d="M10.54 470 l3.9 4.42 l8.06 -8.84" stroke="#0D1117" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="478" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#E6EDF3" text-anchor="start">The Payee picker is from your library.</text><path d="M560 470 H870 L882 148" stroke="#2DD4BF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="470" r="4" fill="#0D1117" stroke="#2DD4BF" stroke-width="2"/></svg>