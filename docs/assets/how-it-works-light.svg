<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">How Resolve works in three steps</title><desc id="d">Illustration. Step 1, Learn components: Resolve reads every component, variant and property, with /design-system. Step 2, Match requests: known names first, other words use the phrase finder, with /find payee picker. Step 3, Check screens: it flags retired, detached and hard-coded parts, with /check.</desc><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="64" y="64" width="325" height="392" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><circle cx="116" cy="116" r="28" fill="#7C3AED"/><text x="116" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><g transform="translate(325 96) scale(1.6666666666666667)" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="88" y="204" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1F2328" text-anchor="start">Learn components</text><text x="88" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">Reads every</text><text x="88" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">component, variant</text><text x="88" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">and property.</text><rect x="88" y="354" width="277" height="64" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="104" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">/design-system</text><rect x="437" y="64" width="325" height="392" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><circle cx="489" cy="116" r="28" fill="#7C3AED"/><text x="489" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><g transform="translate(698 96) scale(0.4166666666666667)"><rect width="96" height="96" rx="24" fill="#7C3AED"/><g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" opacity="0.8"><path d="M48 14 L60 26 L48 38 L36 26 Z"/><path d="M26 36 L38 48 L26 60 L14 48 Z"/><path d="M48 58 L60 70 L48 82 L36 70 Z"/></g><path d="M70 34 L84 48 L70 62 L56 48 Z" fill="#FFFFFF"/></g><text x="461" y="204" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1F2328" text-anchor="start">Match requests</text><text x="461" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">Known names first.</text><text x="461" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">Other words use</text><text x="461" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">the phrase finder.</text><rect x="461" y="354" width="277" height="64" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="477" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">/find payee picker</text><rect x="810" y="64" width="325" height="392" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><circle cx="862" cy="116" r="28" fill="#7C3AED"/><text x="862" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><g transform="translate(1071 96) scale(1.6666666666666667)" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="834" y="204" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1F2328" text-anchor="start">Check screens</text><text x="834" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">Flags retired,</text><text x="834" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">detached and</text><text x="834" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#59636E" text-anchor="start">hard-coded parts.</text><rect x="834" y="354" width="277" height="64" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="850" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">/check</text></svg>
