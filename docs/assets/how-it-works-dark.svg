<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">How Resolve works in three steps</title><desc id="d">Illustration. Step 1, Learn your library: Resolve reads every component, variant and property in your Figma file. Step 2, Match every request: a known name goes straight to its component, other words go to the phrase finder. Step 3, Check the result: Resolve flags retired, detached and hard-coded parts, with the fix.</desc><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="64" y="64" width="325" height="392" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="116" cy="116" r="28" fill="#A78BFA"/><text x="116" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#0D1117" text-anchor="middle">1</text><g transform="translate(325 96) scale(1.6666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="88" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E6EDF3" text-anchor="start">Learn your library</text><text x="88" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">Reads every component,</text><text x="88" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">variant and property</text><text x="88" y="318" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">in your Figma 