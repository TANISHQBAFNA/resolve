xt><rect x="810" y="64" width="325" height="392" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="862" cy="116" r="28" fill="#A78BFA"/><text x="862" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#0D1117" text-anchor="middle">3</text><g transform="translate(1071 96) scale(1.6666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="834" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E6EDF3" text-anchor="start">Check the result</text><text x="834" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">Flags retired, detached</text><text x="834" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">and hard-coded parts,</text><text x="834" y="318" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">with the fix.</text><rect x="834" y="368" width="277" height="56" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/><text x="850" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="400" fill="#E6EDF3" text-anchor="start">/check</text></svg>
