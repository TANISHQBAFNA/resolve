<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">A /check result</title><desc id="d">Illustration of a /check result in a terminal. The verdict line reads Components: PASS, Proper use: FAIL. Three findings follow: a hard-coded fill #1A73E8 with the nearest token color/primary/600, a detached Button that should be re-inserted from the library, and text contrast of 1.7 to 1, below 4.5 to 1.</desc><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="64" y="64" width="1072" height="392" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="96" cy="96" r="7" fill="#30363D"/><circle cx="120" cy="96" r="7" fill="#30363D"/><circle cx="144" cy="96" r="7" fill="#30363D"/><g transform="translate(176 82) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="216" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">/check  Acme · Misused</text><line x1="64" y1="128" x2="1136" y2="128" stroke="#30363D" stroke-width="1"/><text x="96" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">Components: <tspan fill="#3FB950" font-weight="600">PASS</tspan> · Proper use: <tspan fill="#F85149" font-weight="600">FAIL</tspan> <tspan fill="#9198A1">(5 errors, 7 warnings)</tspan></text><circle cx="104" cy="221" r="8" fill="#D29922"/><text x="128" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">Fill #1A73E8 is hard-coded</text><text x="128" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">fix: use the nearest token color/primary/600</text><circle cx="104" cy="297" r="8" fill="#F85149"/><text x="128" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">Button is detached from the library</text><text x="128" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">fix: re-insert the Button instance</text><circle cx="104" cy="373" r="8" fill="#F85149"/><text x="128" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">Hint text contrast is 1.7:1, below 4.5:1</text><text x="128" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">fix: darker text or lighter background</text></svg>
