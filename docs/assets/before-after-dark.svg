idth="1"/><text x="1024.5" y="195" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#9198A1" text-anchor="middle" letter-spacing="0.04em">LIBRARY</text><g transform="translate(672 240) scale(1.0)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="708" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">Text field</text><rect x="961" y="232" width="127" height="40" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="1024.5" y="259" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#9198A1" text-anchor="middle" letter-spacing="0.04em">LIBRARY</text><rect x="672" y="296" width="168" height="40" rx="8" fill="#A78BFA"/><text x="756" y="323" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#0D1117" text-anchor="middle" letter-spacing="0.04em">BUTTON</text><rect x="961" y="296" width="127" height="40" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="1024.5" y="323" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#9198A1" text-anchor="middle" letter-spacing="0.04em">LIBRARY</text><g transform="translate(648 396) scale(1.3333333333333333)" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="692" y="421" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#3FB950" text-anchor="start">Check: PASS</text></svg>
