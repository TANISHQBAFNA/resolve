<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="t d"><title id="t">Without Resolve and with Resolve</title><desc id="d">Illustration. Left, without Resolve: the AI invents a Payee dropdown, hard-codes the colour #1A73E8 and draws a detached Pay now button, and the check fails with 5 errors. Right, with Resolve: the same screen uses the real Payee picker, Text field and Button from the Acme library, and the check passes.</desc><rect x="0.5" y="0.5" width="1199" height="447" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="64" y="64" width="512" height="320" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="88" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E6EDF3" text-anchor="start">Without Resolve</text><g transform="translate(520 90) scale(1.3333333333333333)" fill="none" stroke="#F85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g><text x="508" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#F85149" text-anchor="end">FAIL · 5 errors</text><rect x="88" y="152" width="464" height="208" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="112" y="176" width="208" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1" stroke-dasharray="6 5"/><text x="128" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">Payee dropdown</text><rect x="366" y="176" width="162" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1"/><text x="447.0" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#F85149" text-anchor="middle" letter-spacing="0.04em">INVENTED</text><rect x="112" y="232" width="190" height="48" rx="8" fill="#161B22" stroke="#D29922" stroke-width="1" stroke-dasharray="6 5"/><text x="128" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">#1A73E8 fill</text><rect x="334" y="232" width="194" height="48" rx="8" fill="#161B22" stroke="#D29922" stroke-width="1"/><text x="431.0" y="264" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#D29922" text-anchor="middle" letter-spacing="0.04em">HARD-CODED</text><rect x="112" y="288" width="120" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1" stroke-dasharray="6 5"/><text x="128" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">Pay now</text><rect x="366" y="288" width="162" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1"/><text x="447.0" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#F85149" text-anchor="middle" letter-spacing="0.04em">DETACHED</text><rect x="624" y="64" width="512" height="320" rx="12" fill="#161B22" stroke="#A78BFA" stroke-width="1"/><text x="648" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#A78BFA" text-anchor="start">With Resolve</text><g transform="translate(1080 90) scale(1.3333333333333333)" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="1068" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#3FB950" text-anchor="end">PASS</text><rect x="648" y="152" width="464" height="208" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><g transform="translate(672 188) scale(1.0)" 