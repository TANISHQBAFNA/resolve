<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-labelledby="t d"><title id="t">Without Resolve and with Resolve</title><desc id="d">Illustration. Left, without Resolve: the AI invents a Payee dropdown, hard-codes the colour #1A73E8 with no token and draws a detached Pay now button, and the check fails with 3 errors. Right, with Resolve: the same screen uses the real Payee picker, Text field and Button from the Acme library, and the check passes.</desc><rect x="0.5" y="0.5" width="1199" height="503" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="64" y="64" width="512" height="376" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="88" y="110" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E6EDF3" text-anchor="start">Without Resolve</text><g transform="translate(88 142) scale(1.1666666666666667)" fill="none" stroke="#F85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g><text x="128" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#F85149" text-anchor="start">FAIL · 3 errors</text><rect x="88" y="192" width="464" height="224" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="104" y="216" width="240" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="248" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">Payee dropdown</text><rect x="366" y="216" width="170" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1"/><text x="451.0" y="248" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#F85149" text-anchor="middle" letter-spacing="0.04em">INVENTED</text><rect x="104" y="280" width="240" height="48" rx="8" fill="#161B22" stroke="#D29922" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#E6EDF3" text-anchor="start">#1A73E8 fill</text><rect x="366" y="280" width="170" height="48" rx="8" fill="#161B22" stroke="#D29922" stroke-width="1"/><text x="451.0" y="312" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#D29922" text-anchor="middle" letter-spacing="0.04em">NO TOKEN</text><rect x="104" y="344" width="240" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="376" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#E6EDF3" text-anchor="start">Pay now</text><rect x="366" y="344" width="170" height="48" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1"/><text x="451.0" y="376" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#F85149" text-anchor="middle" letter-spacing="0.04em">DETACHED</text><rect x="624" y="64" width="512" height="376" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="1.5"/><text x="648" y="110" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#2DD4BF" text-anchor="start">With Resolve</text><rect x="648" y="120" width="176" height="5" rx="2.5" fill="#5EEAD4"/><g transform="translate(648 142) scale(1.1666666666666667)" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="688" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#3FB950" text-anchor="start">PASS</text><rect x="648" y="192" width="464" height="224" rx="12" fill="#0