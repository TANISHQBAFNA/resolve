" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#2DD4BF" stroke="#2DD4BF"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g><text x="98" y="472" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">Old Button</text><path d="M72 488 V508 H 96" stroke="#D29922" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/><text x="108" y="516" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">&lt;acme-old-button&gt;</text><text x="500" y="472" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#D29922" text-anchor="end">retired: use Button</text><rect x="40" y="548" width="480" height="104" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(58 566) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#2DD4BF" stroke="#2DD4BF"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g><text x="98" y="588" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">Avatar</text><path d="M72 604 V624 H 96" stroke="#9198A1" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text x="108" y="632" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#9198A1" text-anchor="start">no code twin</text><rect x="40" y="664" width="480" height="104" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(58 682) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke