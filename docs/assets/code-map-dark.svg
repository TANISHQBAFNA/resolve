<svg xmlns="http://www.w3.org/2000/svg" width="560" height="880" viewBox="0 0 560 880" role="img" aria-labelledby="t d"><title id="t">From design to code</title><desc id="d">Illustration of the full Acme code map, 6 parts: 3 mapped, 1 retired and 2 unmapped. Button links to acme-button and AcmeButtonModule, Text field to acme-text-field, Payee picker to acme-payee-picker. Old Button is retired: it still links to acme-old-button, use Button instead. Avatar and Payment method row have no code twin.</desc><rect x="0.5" y="0.5" width="559" height="879" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><text x="40" y="56" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#2DD4BF" text-anchor="start">Figma part, then its code</text><rect x="40" y="66" width="330" height="5" rx="2.5" fill="#5EEAD4"/><rect x="40" y="84" width="480" height="104" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(58 102) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#2DD4BF" stroke="#2DD4BF"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g><text x="98" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">Button</text><path d="M72 140 V160 H 96" stroke="#5EEAD4" stroke-width="3" fill="none" stroke-linecap="round"/><text x="108" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="600" fill="#E6EDF3" text-anchor="start">&lt;acme-button&gt;</text><rect x="40" y="200" width="480" height="104" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><g transform="translate(58 218) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-wid