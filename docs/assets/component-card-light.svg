<svg xmlns="http://www.w3.org/2000/svg" width="560" height="960" viewBox="0 0 560 960" role="img" aria-labelledby="t d"><title id="t">Component card anatomy</title><desc id="d">Illustration of a Resolve card for the real Acme Button, with five numbered parts: 1 the name, Button; 2 its properties, Variant with Primary, Secondary or Danger, and Size with Medium or Large, 4 variants in all; 3 the token it uses, color/primary/600; 4 its code twin, acme-button with AcmeButtonModule; 5 a real example, a thumbnail of the Send money screen. The preview shows Primary, Secondary and Danger.</desc><rect x="0.5" y="0.5" width="559" height="959" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="24" y="24" width="512" height="912" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><rect x="44" y="44" width="472" height="96" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="58" y="64" width="136" height="56" rx="10" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><text x="126.0" y="100" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Primary</text><rect x="208" y="64" width="136" height="56" rx="10" fill="#FFFFFF" stroke="#0D1117" stroke-width="1.5"/><text x="276.0" y="100" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">Secondary</text><rect x="358" y="64" width="136" height="56" rx="10" fill="#CF222E"/><text x="426.0" y="100" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Danger</text><g><circle cx="58" cy="192" r="14" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><text x="58" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">1</text></g><text x="92" y="202" font-family="-apple-sy