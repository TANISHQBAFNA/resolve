<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img" aria-labelledby="t d"><title id="t">Component card anatomy</title><desc id="d">Illustration of a Resolve card for the real Acme Button, with five numbered parts: 1 the name, Button, 4 variants; 2 its properties, Variant with Primary, Secondary or Danger, and Size with Medium or Large; 3 the token it uses, color/primary/600; 4 its code twin, acme-button with AcmeButtonModule; 5 a real example, a thumbnail of the Send money screen. The preview shows Primary, Secondary and Danger side by side.</desc><rect x="0.5" y="0.5" width="819" height="699" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="40" y="40" width="740" height="620" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="64" y="64" width="692" height="112" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="88" y="92" width="204" height="56" rx="10" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.5"/><text x="190.0" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Primary</text><rect x="312" y="92" width="204" height="56" rx="10" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.5"/><text x="414.0" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="middle">Secondary</text><rect x="536" y="92" width="204" height="56" rx="10" fill="#F85149"/><text x="638.0" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Danger</text><g><circle cx="78" cy="230" r="14" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.5"/><text x="78" y="238" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">1</text></g><text x="116" y="240" font-family="-