<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">What the AI gets: a component card</title><desc id="d">Illustration of a Resolve component card for the made-up Acme Button: a small preview, the Angular selector acme-button and AcmeButtonModule, three properties with their allowed values (Variant: Primary, Secondary, Tertiary; Size: Medium, Small, Large; State: Enabled, Disabled), and a line saying it is used on Send money, with a real example to copy.</desc><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="66" y="66" width="1072" height="392" rx="12" fill="#2A1F4A"/><rect x="64" y="64" width="1072" height="392" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="88" y="88" width="320" height="344" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><text x="112" y="132" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#9198A1" text-anchor="start" letter-spacing="0.04em">PREVIEW</text><rect x="128" y="232.0" width="240" height="56" rx="8" fill="#A78BFA"/><text x="248" y="268.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0D1117" text-anchor="middle">Pay now</text><g transform="translate(456 94) scale(1.1666666666666667)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="500" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#E6EDF3" text-anchor="start">Button</text><text x="456" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400"