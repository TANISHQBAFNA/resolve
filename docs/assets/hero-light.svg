<svg xmlns="http://www.w3.org/2000/svg" width="560" height="800" viewBox="0 0 560 800" role="img" aria-labelledby="t d"><title id="t">Prompt to real screen</title><desc id="d">Animation that plays once. A chat message says: Design the Acme Send money screen. Below it, an Acme phone screen builds itself as real library parts snap in: Payee picker, Text field and a Send button. Each part gets a teal library tick.</desc><style>.bub{animation:bub 4s ease-out 1 both}@keyframes bub{0%{opacity:0;transform:translateY(12px)}10%,100%{opacity:1;transform:none}}.p0{animation:p0 4s ease-out 1 both}@keyframes p0{0%,20%{opacity:0;transform:translateY(-18px)}32%,100%{opacity:1;transform:none}}.p1{animation:p1 4s ease-out 1 both}@keyframes p1{0%,42%{opacity:0;transform:translateY(-18px)}54%,100%{opacity:1;transform:none}}.p2{animation:p2 4s ease-out 1 both}@keyframes p2{0%,64%{opacity:0;transform:translateY(-18px)}76%,100%{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="559" height="799" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="40" y="64" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#1F2328" text-anchor="start">Your words become</text><rect x="40" y="74" width="300" height="5" rx="2.5" fill="#2DD4BF" stroke="#0D1117" stroke-width="1"/><text x="40" y="108" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#1F2328" text-anchor="start">a real screen</text><g class="bub"><rect x="40" y="140" width="480" height="150" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><g transform="translate(64 160) scale(1.3333333333333333)" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><rect x="7" y="7.5" width="10" height="4" rx="1.5" fill="#2DD4BF" stroke="#0D1117"/></g><text x="108" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">You</text><text x="64" y="230" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Design the Acme</text><text x="64" y="266" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Send money screen</text></g><g fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M280 300 V332"/><path d="M271 323 L280 332 L289 323"/></g><g><rect x="80" y="344" width="400" height="400" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="244.0" y="358" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="104" y="414" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g class="p0"><rect x="104" y="444" width="352" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="140" cy="476" r="18" fill="#E6FAF7" stroke="#D0D7DE"/><text x="140" y="484" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">M</text><text x="170" y="484" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Maya Chen</text><path d="M426 468 l8 8 l-8 8" stroke="#59636E" stroke-width="2" fill="none"/></g><g class="p1"><text x="104" y="548" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">Amount</text><rect x="104" y="560" width="352" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="120" y="596" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">$120.00</text></g><g class="p2"><rect x="104" y="656" width="352" height="56" rx="10" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><text x="280.0" y="692" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Send</text></g><g class="p0"><circle cx="456" cy="444" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M450 444 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p1"><circle cx="456" cy="560" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M450 560 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p2"><circle cx="456" cy="656" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M450 656 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p2"><g><circle cx="54" cy="774" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M48 774 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="78" y="782" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#59636E" text-anchor="start">= part from your library</text></g></svg>
