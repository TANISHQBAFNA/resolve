<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="t d"><title id="t">Prompt to real screen</title><desc id="d">Animation that plays once. A chat message says: Design the Acme Send money screen. Next to it, an Acme phone screen builds itself as real library parts snap in: Payee picker, Text field and a Send button. Each part gets a teal library tick.</desc><style>.bub{animation:bub 4s ease-out 1 both}@keyframes bub{0%{opacity:0;transform:translateY(12px)}10%,100%{opacity:1;transform:none}}.p0{animation:p0 4s ease-out 1 both}@keyframes p0{0%,20%{opacity:0;transform:translateY(-18px)}32%,100%{opacity:1;transform:none}}.p1{animation:p1 4s ease-out 1 both}@keyframes p1{0%,42%{opacity:0;transform:translateY(-18px)}54%,100%{opacity:1;transform:none}}.p2{animation:p2 4s ease-out 1 both}@keyframes p2{0%,64%{opacity:0;transform:translateY(-18px)}76%,100%{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="819" height="559" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="40" y="72" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" fill="#1F2328" text-anchor="start">Your words become a real screen</text><rect x="40" y="82" width="625" height="5" rx="2.5" fill="#2DD4BF" stroke="#0D1117" stroke-width="1"/><g class="bub"><rect x="40" y="120" width="320" height="170" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><g transform="translate(64 142) scale(1.3333333333333333)" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><rect x="7" y="7.5" width="10" height="4" rx="1.5" fill="#2DD4BF" stroke="#0D1117"/></g><text x="108" y="166" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">You</text><text x="64" y="218" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Design the Acme</text><text x="64" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Send money screen</text></g><g fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M372 205 H412"/><path d="M403 196 L412 205 L403 214"/></g><g><rect x="440" y="112" width="340" height="412" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="574.0" y="126" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="464" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g class="p0"><rect x="460" y="212" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="496" cy="244" r="18" fill="#E6FAF7" stroke="#D0D7DE"/><text x="496" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">M</text><text x="526" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Maya Chen</text><path d="M730 236 l8 8 l-8 8" stroke="#59636E" stroke-width="2" fill="none"/></g><g class="p1"><text x="460" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">Amount</text><rect x="460" y="328" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="476" y="364" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">$120.00</text></g><g class="p2"><rect x="460" y="424" width="300" height="56" rx="10" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><text x="610.0" y="460" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D1117" text-anchor="middle">Send</text></g><g class="p0"><circle cx="760" cy="212" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M754 212 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p1"><circle cx="760" cy="328" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M754 328 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p2"><circle cx="760" cy="424" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M754 424 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p0"><g><circle cx="56" cy="344" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M50 344 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="352" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Payee picker</text></g><g class="p1"><g><circle cx="56" cy="400" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M50 400 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="408" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Text field</text></g><g class="p2"><g><circle cx="56" cy="456" r="13" fill="#2DD4BF" stroke="#0D1117" stroke-width="1.5"/><path d="M50 456 l4 4 l8 -9" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82"