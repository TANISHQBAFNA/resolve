<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Prompt to real screen</title><desc id="d">Animation. A chat message says: Design the Acme Send money screen. Next to it, an Acme phone screen builds itself as real library parts snap in: Payee picker, Amount field and a Send button. Each part gets a teal library tick.</desc><style>.bub{animation:bub 6s ease-out infinite both}@keyframes bub{0%{opacity:0;transform:translateY(12px)}6%,100%{opacity:1;transform:none}}.p0{animation:p0 6s ease-out infinite both}@keyframes p0{0%,14%{opacity:0;transform:translateY(-18px)}22%,100%{opacity:1;transform:none}}.p1{animation:p1 6s ease-out infinite both}@keyframes p1{0%,32%{opacity:0;transform:translateY(-18px)}40%,100%{opacity:1;transform:none}}.p2{animation:p2 6s ease-out infinite both}@keyframes p2{0%,50%{opacity:0;transform:translateY(-18px)}58%,100%{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="64" y="88" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#1F2328" text-anchor="start">Your words become a real screen</text><rect x="64" y="98" width="600" height="5" rx="2.5" fill="#2DD4BF" stroke="#0D1117" stroke-width="1"/><g class="bub"><rect x="64" y="176" width="420" height="176" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><g transform="translate(88 200) scale(1.5)" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><rect x="7" y="7.5" width="10" height="4" rx="1.5" fill="#2DD4BF" stroke="#0D1117"/></g><text x="140" y="228" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">You</text><text x="88" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Design the Acme</text><text x="88" y="322" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#1F2328" text-anchor="start">Send money screen</text></g><g fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M500 264 H556"/><path d="M547 255 L556 264 L547 273"/></g><g><rect x="580" y="120" width="300" height="384" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="694.0" y="134" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="604" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g class="p0"><rect x="600" y="220" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><circle cx="636" cy="252" r="18" fill="#E6FAF7" stroke="#D0D7DE"/><text x="636" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">M</text><text x="666" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">Maya Chen</text><path d="M830 244 l8 8 l-8 8" stroke="#59636E" stroke-width="2" fill="none"/></g><g class="p1"><text x="600" y="324" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">Amount</text><rect x="600" y="336" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="616" y="372" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">$120.00</text></g><g class="p2"><rect x="600" y="416" 