<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-labelledby="t d"><title id="t">Without Resolve and with Resolve</title><desc id="d">Illustration. Left, without Resolve: the AI invents a Payee dropdown, hard-codes the colour #1A73E8 with no token and draws a detached Pay now button, and the check fails with 3 errors. Right, with Resolve: the same screen uses the real Payee picker, Text field and Button from the Acme library, and the check passes.</desc><rect x="0.5" y="0.5" width="1199" height="503" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="64" y="64" width="512" height="376" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="88" y="110" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#1F2328" text-anchor="start">Without Resolve</text><g transform="translate(88 142) scale(1.1666666666666667)" fill="none" stroke="#CF222E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g><text x="128" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#CF222E" text-anchor="start">FAIL · 3 errors</text><rect x="88" y="192" width="464" height="224" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="104" y="216" width="240" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="248" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#1F2328" text-anchor="start">Payee dropdown</text><rect x="366" y="216" width="170" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1"/><text x="451.0" y="248" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#CF222E" text-anchor="middle" letter-spacing="0.04em">INVENTED</text><rect x="104" y="280" width="240" height="48" rx="8" fill="#F6F8FA" stroke="#9A6700" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">#1A73E8 fill</text><rect x="366" y="280" width="170" height="48" rx="8" fill="#F6F8FA" stroke="#9A6700" stroke-width="1"/><text x="451.0" y="312" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#9A6700" text-anchor="middle" letter-spacing="0.04em">NO TOKEN</text><rect x="104" y="344" width="240" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="376" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#1F2328" text-anchor="start">Pay now</text><rect x="366" y="344" width="170" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1"/><text x="451.0" y="376" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#CF222E" text-anchor="middle" letter-spacing="0.04em">DETACHED</text><rect x="624" y="64" width="512" height="376" rx="12" fill="#F6F8FA" stroke="#14B8A6" stroke-width="1"/><text x="648" y="110" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#0D9488" text-anchor="start">With Resolve</text><g transform="translate(648 142) scale(1.1666666666666667)" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="688" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1A7F37" text-anchor="start">PASS</text><rect x="648" y="192" width="464" height="224" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><g transform="translate(664 22