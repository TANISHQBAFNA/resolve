<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="464" viewBox="0 0 1200 464" role="img" aria-labelledby="t d"><title id="t">Without Resolve and with Resolve</title><desc id="d">Illustration. Left, without Resolve: the AI invents a Payee dropdown, hard-codes the colour #1A73E8 and draws a detached Pay now button, and the check fails with 5 errors. Right, with Resolve: the same screen uses the real Payee picker, Text field and Button from the Acme library, and the check passes.</desc><rect x="0.5" y="0.5" width="1199" height="463" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="64" y="64" width="512" height="336" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="88" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#1F2328" text-anchor="start">Without Resolve</text><g transform="translate(520 90) scale(1.3333333333333333)" fill="none" stroke="#CF222E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g><text x="508" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#CF222E" text-anchor="end">FAIL · 5 errors</text><rect x="88" y="152" width="464" height="224" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><rect x="104" y="176" width="216" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1" stroke-dasharray="6 5"/><text x="120" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#1F2328" text-anchor="start">Payee dropdown</text><rect x="374" y="176" width="162" height="48" rx="8" fill="#F6F8FA" stroke="#CF222E" stroke-width="1"/><text x="455.0" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#CF222E" text-anchor="middle" letter-spacing="0.04em">INVENTED</text><r