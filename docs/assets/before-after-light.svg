<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720" role="img" aria-labelledby="t d"><title id="t">Without Resolve and with Resolve</title><desc id="d">Illustration. Two Acme Send money screens. Left, without Resolve, the check fails: numbered callouts mark an invented Choose payee dropdown, a raw #1A73E8 fill and a detached Pay now button. Right, with Resolve, the check passes: the same screen built from the library Payee picker, Text field and Button.</desc><rect x="0.5" y="0.5" width="819" height="719" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="40" y="56" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#1F2328" text-anchor="start">Without Resolve</text><g fill="none" stroke="#CF222E" stroke-width="2.5" stroke-linecap="round"><circle cx="302" cy="50" r="11"/><path d="M297 45 l10 10 M307 45 l-10 10"/></g><text x="324" y="58" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#CF222E" text-anchor="start">FAIL</text><g><rect x="40" y="88" width="340" height="448" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="174.0" y="102" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="64" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g><rect x="60" y="188" width="300" height="64" rx="10" fill="#FFFFFF" stroke="#CF222E" stroke-width="1.5" stroke-dasharray="6 5"/><text x="76" y="228" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#59636E" text-anchor="start">Choose payee</text><path d="M326 216 l8 8 l8 -8" stroke="#59636E" stroke-width="2" fill="none"/></g><g><text x="60" y="292" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#59636E" text-anchor="start">Amount</text><rect x="60" y="304" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="76" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">$120.00</text></g><g><rect x="60" y="384" width="300" height="56" rx="10" fill="#1A73E8" stroke="#9A6700" stroke-width="2" stroke-dasharray="6 5"/><text x="210.0" y="420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send</text></g><g><rect x="60" y="456" width="300" height="56" rx="10" fill="#F6F8FA" stroke="#CF222E" stroke-width="1.5" stroke-dasharray="6 5"/><text x="210.0" y="492" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="middle">Pay now</text></g><g><circle cx="398" cy="220" r="14" fill="#CF222E" stroke="#CF222E" stroke-width="1.5"/><text x="398" y="228" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><g><circle cx="398" cy="412" r="14" fill="#9A6700" stroke="#9A6700" stroke-width="1.5"/><text x="398" y="420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><g><circle cx="398" cy="484" r="14" fill="#CF222E" stroke="#CF222E" stroke-width="1.5"/><text x="398" y="492" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><g><circle cx="54" cy="572" r="14" fill="#CF222E" stroke="#CF222E" stroke-width="1.5"/><text x="54" y="580" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text></g><text x="80" y="580" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">Invented dropdown</text><g><circle cx="54" cy="616" r="14" fill="#9A6700" stroke="#9A6700" stroke-width="1.5"/><text x="54" y="624" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text></g><text x="80" y="624" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">Raw #1A73E8 fill</text><g><circle cx="54" cy="660" r="14" fill="#CF222E" stroke="#CF222E" stroke-width="1.5"/><text x="54" y="668" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text></g><text x="80" y="668" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#1F2328" text-anchor="start">Detached button</text><text x="440" y="56" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#1F2328" text-anchor="start">With Resolve</text><rect x="440" y="66" width="188" height="5" rx="2.5" fill="#2DD4BF" stroke="#0D1117" stroke-width="1"/><g fill="none" stroke="#1A7F37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="702" cy="50" r="11"/><path d="M696 50 l4 4 l8 -9"/></g><text x="724" y="58" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1A7F37" text-anchor="start">PASS</text><g><rect x="440" y="88" width="340" height="448" rx="28" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><rect x="574.0" y="102" width="72" height="8" rx="4" fill="#D0D7DE"/><text x="464" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">Send money</text></g><g><rect x="460" y="188" width="300" height="64" rx="10" fill="#FFFFFF"