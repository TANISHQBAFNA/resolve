name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        tz: [UTC, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # prepare skips the server build when CI is set. build typechecks, then builds each bundle once.
      # Tests that spawn the MCP server need dist-server, so the build comes first.
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:size
      - run: npm run check:dupes
      - name: Score the fixture library
        env:
          RESOLVE_WORKSPACE: fixture
        run: |
          set -o pipefail
          npm run resolve -- ingest scoreboard/fixture/library.json --role library --name "Scoreboard fixture"
          npm run resolve -- score phrases --phrases scoreboard/phrases --json > "$RUNNER_TEMP/phrases.json"
          npm run resolve -- score --golden scoreboard/golden --workspace fixture --json > "$RUNNER_TEMP/golden.json"
          node scripts/check-phrase-floor.mjs scoreboard/phrase-baseline.json "$RUNNER_TEMP/phrases.json" "$RUNNER_TEMP/golden.json"
      - name: Guard multi-library picks
        run: node scripts/check-multi-library.mjs

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        tz: [UTC, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
