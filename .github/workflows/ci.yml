name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/code-map-v1]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Typecheck and build only. The automated suite is not in this tree.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
